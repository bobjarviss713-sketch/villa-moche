<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Villa Moche - ERP/POS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">
      <div class="login-box">
        <div class="login-logo">VILLA MOCHE</div>
        <p class="login-subtitle">Recreo Campestre &bull; Sistema de Gesti&oacute;n</p>
        <div class="login-section">
          <div class="login-section-title">Sistema</div>
          <button class="login-btn admin" onclick="loginUser(1)">
            <i class="fas fa-user-shield"></i> Administrador
          </button>
          <button class="login-btn cocina" onclick="loginUser(2)">
            <i class="fas fa-fire-burner"></i> Cocina Central
          </button>
        </div>
        <div class="login-section">
          <div class="login-section-title">Mozos</div>
          <select id="loginMozoSelect" class="login-select">
            <option value="">Seleccionar Mozo...</option>
          </select>
          <button class="login-btn mozo" onclick="loginSelected('mozo')">
            <i class="fas fa-bell-concierge"></i> Ingresar como Mozo
          </button>
        </div>
        <div class="login-section">
          <div class="login-section-title">Cajeras</div>
          <select id="loginCajeraSelect" class="login-select">
            <option value="">Seleccionar Cajera...</option>
          </select>
          <button class="login-btn cajera" onclick="loginSelected('cajera')">
            <i class="fas fa-cash-register"></i> Ingresar como Cajera
          </button>
        </div>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" class="main-app" style="display:none">
      <!-- SIDEBAR -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">VILLA MOCHE</div>
          <small id="roleBadge">Sistema de Gesti&oacute;n</small>
        </div>
        <nav id="sidebarMenu" class="sidebar-menu"></nav>
        <div class="sidebar-footer">
          <button class="btn-logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesi&oacute;n
          </button>
        </div>
      </aside>

      <!-- CONTENT -->
      <div class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button id="menuToggle" class="btn btn-outline btn-sm" onclick="toggleSidebar()">
              <i class="fas fa-bars"></i>
            </button>
            <h1 id="pageTitle">Dashboard</h1>
          </div>
          <div class="topbar-right">
            <span class="badge" id="topbarUser">
              <i class="fas fa-user"></i> <span id="topbarUserName"></span>
            </span>
            <span class="badge badge-cyan" id="topbarRole">
              <i class="fas fa-tag"></i> <span id="topbarRoleName"></span>
            </span>
            <div class="notif-bell" id="notifBell" onclick="toggleNotifications()" style="display:none">
              <i class="fas fa-bell"></i>
              <span class="badge-count" id="notifCount" style="display:none">0</span>
            </div>
            <div class="notif-panel" id="notifPanel"></div>
            <span id="clock" class="clock"></span>
          </div>
        </header>
        <div class="content" id="contentArea">
          <!-- All views rendered here -->
        </div>
      </div>
    </div>

    <!-- CARTA DIGITAL PUBLICA -->
    <div id="publicMenuScreen" class="public-menu-screen" style="display:none">
      <div class="public-menu-header">
        <h1>VILLA MOCHE</h1>
        <p>Recreo Campestre</p>
        <div class="mesa-badge" id="publicMesaBadge">Mesa</div>
      </div>
      <div class="public-menu-body" id="publicMenuBody"></div>
      <div class="public-menu-cart-fab" id="publicCartFab" style="display:none">
        <button onclick="showPublicCartModal()">
          <i class="fas fa-shopping-cart"></i> Ver Pedido
          <span class="cart-count" id="publicCartCount">0</span>
        </button>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
      <div class="modal" id="modalContent" onclick="event.stopPropagation()"></div>
    </div>

    <!-- TOASTS -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/mozo.js"></script>
  <script src="js/views/cocina.js"></script>
  <script src="js/views/cajera.js"></script>
  <script src="js/views/public-cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
